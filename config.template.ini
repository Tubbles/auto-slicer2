[PATHS]
# Where to move files after slicing
archive_directory = archive
# Path to the CuraEngine binary
cura_engine_path = /path/to/CuraEngine
# Directory containing the .json definitions (usually in resources/definitions)
definition_dir = /path/to/Cura/resources/definitions
# The specific printer file name
printer_definition = creality_ender3.def.json
# Archive for GitHub slicing results (leave empty to disable GitHub slicing)
github_archive_directory =

# Slicer defaults and bounds are in auto_slicer/defaults.py
# You can add [DEFAULT_SETTINGS] or [BOUNDS_OVERRIDES] sections here to extend/override.

[TELEGRAM]
# Get token from @BotFather
bot_token = YOUR_BOT_TOKEN_HERE
# Comma-separated list of allowed Telegram user IDs (get yours by messaging @userinfobot)
# Leave empty to allow everyone
allowed_users =
# Chat ID to notify on startup (your user ID or a group chat ID)
# Leave empty to disable
notify_chat_id =
# Mini App settings (leave empty to disable)
# Port for the HTTP API server (0 = disabled)
api_port =
# URL where webapp/index.html is hosted (e.g. GitHub Pages)
webapp_url =
# Public URL of the HTTP API (must be HTTPS for Mini App)
api_base_url =

[GITHUB]
# GitHub slicing: slice STLs that CI exports as Actions artifacts.
# Off unless both token and [PATHS] github_archive_directory are set.
# Fine-grained token with Actions read-only. Artifact downloads need it even on public repos
token =
# Comma-separated owner/repo list
repos = Tubbles/model-workshop
# Artifact zips, extracted models and thumbnails, keyed by artifact id
cache_directory = cache/github

[MOONRAKER]
# Moonraker to serve GitHub slicing to as an agent, e.g. http://fluiddpi:7125 (empty = no agent)
url =
# Only when Moonraker requires an API key
api_key =
# github_archive_directory as Moonraker's gcodes root sees it, e.g. Sync/Autoslice Github
gcodes_prefix =
